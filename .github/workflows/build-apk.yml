name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode signing keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "solo-leveling-build-${{ github.run_number }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            "solo-leveling-build-${{ github.run_number }}.apk" \
            --title "Build #${{ github.run_number }}" \
            --generate-notes
