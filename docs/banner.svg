<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="Solo Leveling Android Workout Tracker">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="65%" stop-color="#05090C" />
      <stop offset="100%" stop-color="#001214" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#008B8B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00FFFF" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Pitch-black base -->
  <rect width="880" height="200" rx="6" fill="url(#bgGrad)" />

  <!-- Subtle dark geometric grid -->
  <g stroke="#121212" stroke-width="1">
    <line x1="0" y1="50" x2="880" y2="50" />
    <line x1="0" y1="100" x2="880" y2="100" />
    <line x1="0" y1="150" x2="880" y2="150" />
    <line x1="220" y1="0" x2="220" y2="200" />
    <line x1="440" y1="0" x2="440" y2="200" />
    <line x1="660" y1="0" x2="660" y2="200" />
  </g>

  <!-- Outer hairline border and corner brackets -->
  <rect x="8" y="8" width="864" height="184" rx="4" fill="none" stroke="#222222" stroke-width="1" />
  <path d="M 8 28 L 8 8 L 28 8" fill="none" stroke="#00FFFF" stroke-width="2" />
  <path d="M 852 8 L 872 8 L 872 28" fill="none" stroke="#00FFFF" stroke-width="2" />
  <path d="M 8 172 L 8 192 L 28 192" fill="none" stroke="#00FFFF" stroke-width="2" />
  <path d="M 852 192 L 872 192 L 872 172" fill="none" stroke="#00FFFF" stroke-width="2" />

  <!-- Top tag pill matching DashboardScreen header -->
  <rect x="44" y="34" width="176" height="24" rx="2" fill="#000000" stroke="#00FFFF" stroke-width="1" />
  <text x="132" y="50" text-anchor="middle" fill="#00FFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2">WORKOUT TRACKER</text>

  <!-- Right-side protocol indicator -->
  <text x="836" y="50" text-anchor="end" fill="#8E8E93" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.5">ANDROID // COMPOSE</text>

  <!-- Main Title -->
  <text x="44" y="110" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="42" font-weight="800" letter-spacing="5">SOLO LEVELING</text>

  <!-- Accent Divider -->
  <rect x="44" y="128" width="792" height="1.5" fill="url(#cyanLine)" />

  <!-- Subtitle -->
  <text x="44" y="158" fill="#E0FFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="1">Weekly bodyweight splits, gesture-driven timers, and progressive overload tracking.</text>
</svg>
